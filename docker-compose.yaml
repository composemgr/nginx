# nginx proxy address - http://172.17.0.1:64271

name: nginx
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: richarvey/nginx-php-fpm:latest
    container_name: nginx-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: nginx-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      # PHP error display
      ERRORS: 0
      PHP_ERRORS_STDERR: 1
      # Version control
      GIT_USE_SSH: 1
      REMOVE_FILES: 0
      # Client IP handling
      REAL_IP_HEADER: 1
      # Document root
      DOMAIN: ${BASE_HOST_NAME:-$HOSTNAME}
      # Upload limits
      PHP_POST_MAX_SIZE: 256m
      PHP_UPLOAD_MAX_FILESIZE: 1024m
      # Response headers
      HIDE_NGINX_HEADERS: 1
      APPLICATION_ENV: production
    ports:
      - '172.17.0.1:64271:80'
    volumes:
      - '/etc/letsencrypt:/etc/letsencrypt:z'
      - '/var/www/nginx/domains/${BASE_HOST_NAME:-$HOSTNAME}:/var/www/html:z'
    networks:
      - nginx

networks:
  nginx:
    name: nginx
    external: false
